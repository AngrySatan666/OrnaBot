;# <!-- OrnaBot Directory & Files Explained -----> #;
[MetaData]
Version = '3.2'
Date = '4/27/25'

;## <!-- [SS-1]: The Architecture -----> ##;
[Root]
Root = */OrnaBot/ and contains ALL of OrnaBot

[OrnaBot]
bp = Folder containing the BluePrint Modules for OrnaBots API endpoints 
data = Folder which contains static type data that helps the bot run or function properly
database = Folder which contains all the bots logs, statistics, and events
__init__.py = Main Flask_app intialization file
flask_app.py = Main Flask_app script and functions
OrnaBot-ADB.py = The Locally Ran OrnaBot Script, which uses ADB Commands and ScrCpy on a Connected Android Device
Run.bat = A Temporary Developer Assets that provides a terminal with debugging information after a fatal crash

[OrnaBot/bp]
Collect.bp.py = API Endpoint BluePrint for Collecting specific data from the database and returning to the console, or a browser for away from device stat viewing
Screen.bp.py = API Endpoint BluePrint for sending screenshots of the device to the Flask app so it can extract data and insert it to the database
Upload.bp.py = API Endpoint BluePrint for sending JSONPayloads to the Flask app for it to format and insert into the database
 
[OrnaBot/data]
images = Folder which contains all Images the Bot needs in order to detect content on the Screen
json = Folder which contains temporary developer assets in json formatted databases of all the information needed to build the sql database files and schemas
Architecture.ini = This File, strictly for explaining what each folder and file is for to developers
bot.cfg = A Configuration File used by the bot to determine its functionings and startup methods

[OrnaBot/data/images]
map = Folder containing all Map Based Images such as shops, dungeons, player homes, etc.
mob = Folder containing all Creature based Images such as Regular Creatures, Bosses, and Raids

[OrnaBot/data/json]
database.json = Json file containing all data for the developers to build the initial database and its schemas
user.json = Json file containing all user selectable type data for the developers to build user_settings files and configurations 

[OrnaBot/database]
migrations = Folder thats empty but will contain all database and schema updates, rollbacks, and changes in the future
schemas = Folder containg all the inital schema files for the sql databases

[OrnaBot/database/migrations]
README.md = A Developer Asset File containing txt formatted explinations of the files within the migrations folder 

[OrnaBot/database/schemas]
battle.schema.sql = Sql initial Schema file for the Battles Database
creature.schema.sql = Sql initial Schema file for the Creatures Database
items.schema.sql = Sql initial Schema file for the Items Database
player.schema.sql = Sql initial Schema file for the Players Database
shops.schema.sql = Sql initial Schema file for the Shops Database
stats.schema.sql = Sql initial Schema file for the Bots Statics Database